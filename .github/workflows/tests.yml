name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - name: Run synthetic worked example
        run: >-
          python -m finance_control_lab
          --source examples/source.csv --ledger examples/ledger.csv
          --rules rules/demo.json --output-dir demo-output
      - name: Verify published example against independent hand-calculated reference
        run: python scripts/check_example.py demo-output/report.json
