[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-finance-control-lab"
version = "0.1.0"
description = "Synthetic invoice reconciliation and exception control teaching lab"
requires-python = ">=3.11"
authors = [{name = "Muhammad Jawad"}]
dependencies = []

[tool.setuptools.packages.find]
include = ["finance_control_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
